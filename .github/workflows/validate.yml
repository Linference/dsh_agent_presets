name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm test

      # Reproducibility gate: the checked-in presets must be exactly what the
      # single-source data (.github/presets.json + baseline) describes.
      - run: npm run generate

      - run: git diff --exit-code
